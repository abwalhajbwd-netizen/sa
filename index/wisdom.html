<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f5f1">
    <title>نبذة عن الحكمة</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 24px 48px;
            color: #183b3b;
            background: #f2f5f1;
            font-family: Tahoma, Arial, sans-serif;
        }

        main {
            width: min(100%, 760px);
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #183b3b;
            font-size: 16px;
            font-weight: 700;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        article {
            overflow: hidden;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 28px rgb(24 59 59 / 12%);
        }

        article img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #d9e2dc;
        }

        .content {
            padding: 24px;
        }

        .wisdom-details {
            padding: 20px 22px;
            border: 1px solid #dce7e1;
            border-radius: 10px;
            background: #f7faf7;
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(26px, 5vw, 36px);
            line-height: 1.5;
        }

        blockquote {
            margin: 0 0 20px;
            padding: 18px 20px;
            border-inline-start: 5px solid #efb172;
            border-radius: 8px;
            color: #fff;
            background: #183b3b;
            font-family: "Noto Naskh Arabic", Amiri, "Traditional Arabic", serif;
            font-size: clamp(22px, 4vw, 28px);
            font-weight: 600;
            line-height: 1.8;
            text-align: center;
        }

        .wisdom-details h2 {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 12px;
            color: #183b3b;
            font-size: 23px;
            line-height: 1.5;
        }

        .wisdom-details h2::before {
            color: #b85d3b;
            content: "✦";
            font-size: 20px;
        }

        .wisdom-details p {
            margin: 0;
            color: #344f4b;
            font-size: 20px;
            font-weight: 500;
            line-height: 2;
        }

        .entry-navigation {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
        }

        .entry-navigation a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 10px 16px;
            border: 1px solid #183b3b;
            border-radius: 8px;
            color: #183b3b;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
        }

        .entry-navigation a:hover,
        .entry-navigation a:focus-visible {
            color: #fff;
            background: #183b3b;
        }

        .entry-navigation a[hidden] {
            display: none;
        }

        .not-found {
            padding: 24px;
            border-radius: 12px;
            background: #fff;
            font-size: 18px;
            line-height: 1.8;
        }

        @media (max-width: 640px) {
            body {
                padding: 20px 18px 36px;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <a class="back-link" href="index.html#gallery">العودة إلى معرض الصور</a>
        <article id="wisdom-card" hidden>
            <img id="scene-image" alt="">
            <div class="content">
                <h1 id="scene-title"></h1>
                <blockquote id="scene-wisdom"></blockquote>
                <section class="wisdom-details" aria-labelledby="details-title">
                    <h2 id="details-title">معنى الحكمة وفائدتها</h2>
                    <p id="scene-benefit"></p>
                </section>
                <nav class="entry-navigation" aria-label="التنقل بين الحكم">
                    <a id="previous-entry" hidden>← الحكمة السابقة</a>
                    <a id="next-entry" hidden>الحكمة التالية →</a>
                </nav>
            </div>
        </article>
        <p class="not-found" id="not-found" hidden>لم نعثر على حكمة لهذه الصورة. يمكنك العودة إلى معرض الصور واختيار صورة أخرى.</p>
    </main>
    <script>

            {

            },

            },
            {

                benefit: "تدعونا إلى تقبّل تغيّر المراحل؛ فلكل تجربة أثرها ومعناها، ويمكننا أن نجد في الوداع ذكرى جميلة أو درسًا نافعًا."
            },
            {

            },

            },

            },

                alt: "حيوان بري بين الجبال والأشجار",
                title: "حياة برية",

            },
            {

            },

                alt: "ضباب يحيط بجبال خضراء وقت الشروق",
                title: "جبال يكسوها الضباب",
                wisdom: "ليس كل ما غاب عن العين قد ضاع.",
                benefit: "قد تحجب الظروف الرؤية مؤقتًا، لكن ذلك لا يعني أن الطريق انتهى. تمنحنا الحكمة مساحة للصبر حتى تتضح الخطوة التالية."
            },
            {
                image: "nature-lake.jpg",
                alt: "بحيرة جبلية صافية تحيط بها الجبال",
                title: "بحيرة جبلية",
                wisdom: "صفاء القلب يعكس جمال العالم.",
                benefit: "حين نخفف من التوتر والأحكام المسبقة، نصبح أقدر على رؤية الجوانب الجميلة في الناس والأماكن والتعامل معها بلطف."
            },
            {
                image: "nature-river.jpg",
                alt: "نهر صافٍ يجري بين الصخور والغابة",
                title: "نهر وسط الغابة",
                wisdom: "امضِ بهدوء، فلكل طريق مجراه.",
                benefit: "المقارنة بالآخرين قد تشتتنا؛ فلكل شخص ظروفه وإيقاعه. ركّز على مسارك واتخذ الخطوة المناسبة لك."
            },
            {
                image: "nature-snow.jpg",
                alt: "جبال ووديان تغطيها الثلوج",
                title: "مناظر شتوية",
                wisdom: "وراء البرد سكون يهيئ للحياة.",
                benefit: "بعض فترات الهدوء تبدو بطيئة، لكنها تمنحنا فرصة للراحة والاستعداد. ليس كل توقف تعطّلًا؛ فقد يكون تمهيدًا لبداية."
            },
            {
                image: "nature-autumn.jpg",
                alt: "أشجار خريفية ملونة تنعكس على سطح الماء",
                title: "ألوان الخريف",
                wisdom: "التغيير قد يكون أجمل فصول الحياة.",
                benefit: "تساعدنا على استقبال التغيير بفضول بدل الخوف، ورؤية ما يمكن أن يفتحه من فرص وتجارب جديدة."
            },
            {
                image: "nature-valley.jpg",
                alt: "وادي أخضر بين تلال جبلية",
                title: "وادي جبلي",
                wisdom: "بين القمم متسعٌ للطريق والأمل.",
                benefit: "حتى عندما تبدو العقبات عالية، قد توجد طرق ومساحات لم نلاحظها بعد. التشاور والتأني يساعدان على اكتشافها."
            },
            {
                image: "nature-cactus.jpg",
                alt: "نبات صبار بأشواك دقيقة",
                title: "نباتات صحراوية",
                wisdom: "الصبر يزهر حتى في أقسى الظروف.",
                benefit: "تذكّرنا بأن القدرة على التكيّف والصمود قد تساعدنا على بناء حياة طيبة رغم التحديات، مع الحرص على طلب الدعم عند الحاجة."
            },
            {
                image: "nature-hills.jpg",
                alt: "طبقات من الجبال تتدرج في الأفق",
                title: "جبال متدرجة",
                wisdom: "كل أفق جديد يكشف طريقًا آخر.",
                benefit: "كلما اكتسبنا خبرة واتسعت رؤيتنا، ظهرت أمامنا خيارات جديدة. التعلم المستمر يساعدنا على مواصلة الاكتشاف والتقدم."
            }
        ];

        const imageParameter = new URLSearchParams(window.location.search).get("image");
        const imageIndex = imageParameter !== null && /^\d+$/.test(imageParameter)
            ? Number(imageParameter)
            : -1;
        const entry = wisdomEntries[imageIndex];

        if (entry) {
            document.title = `نبذة عن الحكمة: ${entry.title}`;
            document.getElementById("scene-image").src = entry.image;
            document.getElementById("scene-image").alt = entry.alt;
            document.getElementById("scene-title").textContent = entry.title;
            document.getElementById("scene-wisdom").textContent = `❝ ${entry.wisdom} ❞`;
            document.getElementById("scene-benefit").textContent = entry.benefit;
            const previousLink = document.getElementById("previous-entry");
            const nextLink = document.getElementById("next-entry");
            if (imageIndex > 0) {
                previousLink.href = `wisdom.html?image=${imageIndex - 1}`;
                previousLink.hidden = false;
            }
            if (imageIndex < wisdomEntries.length - 1) {
                nextLink.href = `wisdom.html?image=${imageIndex + 1}`;
                nextLink.hidden = false;
            }
            document.getElementById("wisdom-card").hidden = false;
        } else {
            document.getElementById("not-found").hidden = false;
        }
    </script>
</body>
</html>
