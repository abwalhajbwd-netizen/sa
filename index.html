<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f5f1">
    <title>مرحباً</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 0 24px 48px;
            color: #183b3b;
            background: #f2f5f1;
            font-family: Tahoma, Arial, sans-serif;
        }

        .ticker {
            display: block;
            width: 100vw;
            min-height: 58px;
            margin: 0 calc(50% - 50vw);
            color: #183b3b;
            background: transparent;
        }

        .ticker-track {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 58px;
        }

        .ticker-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            min-height: 58px;
            gap: 4px 12px;
            padding: 8px 16px;
            direction: rtl;
            white-space: nowrap;
            font-size: clamp(18px, 2.4vw, 24px);
            font-weight: 700;
        }

        .ticker-group span::after {
            margin-inline-start: 8px;
            color: #7fd04c;
            content: "✦";
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        main {
            width: min(100%, 1000px);
            margin: 0 auto;
        }

        header {
            margin: 0 0 38px;
            text-align: center;
        }

        .salawat {
            margin: 0 0 8px;
            color: #b85d3b;
            font-size: clamp(30px, 4vw, 40px);
            line-height: 1.5;
        }

        h1 {
            margin: 0;
            font-size: clamp(58px, 10vw, 92px);
            line-height: 1.2;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        figure {
            min-width: 0;
            margin: 0;
        }

        figure img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            object-position: center 55%;
            background: #d9e2dc;
        }

        figcaption {
            margin-top: 12px;
            padding: 14px 18px;
            border-radius: 8px;
            color: #fff;
            background: #183b3b;
            font-size: 20px;
            font-weight: 700;
        }

        .wisdom-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-inline-start: 10px;
            padding: 5px 9px;
            border: 1px solid #efb172;
            border-radius: 999px;
            color: #fff;
            font-size: 13px;
            font-weight: 400;
            text-decoration: none;
            vertical-align: middle;
        }

        .wisdom-link:hover,
        .wisdom-link:focus-visible {
            color: #183b3b;
            background: #efb172;
        }

        .wisdom {
            display: block;
            margin-top: 8px;
            color: #d7e5df;
            font-family: "Noto Naskh Arabic", Amiri, "Traditional Arabic", serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.9;
            text-align: center;
        }

        .wisdom::before {
            margin-inline-end: 6px;
            color: #efb172;
            content: "❝";
            font-family: Georgia, serif;
            font-size: 20px;
            vertical-align: -2px;
        }

        .caption-icon {
            margin-inline-end: 10px;
            font-size: 24px;
            vertical-align: middle;
        }

        @media (max-width: 640px) {
            body {
                padding: 0 18px 36px;
            }

            .ticker {
                min-height: 52px;
            }

            .ticker-group {
                font-size: 18px;
            }

            .ticker-group span::after {
                margin-inline-start: 4px;
            }

            header {
                margin-bottom: 28px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

    </style>
</head>
<body>
    <div class="ticker">
        <span class="visually-hidden">الحمد لله، الشكر لله، سبحان الله وبحمده، سبحان الله العظيم</span>
        <div class="ticker-track" aria-hidden="true">
            <div class="ticker-group">
                <span>الحمد لله</span>
                <span>الشكر لله</span>
                <span>سبحان الله وبحمده</span>
                <span>سبحان الله العظيم</span>
            </div>
        </div>
    </div>
    <main>
        <header>

            </figure>
            <figure>

            </figure>
            <figure>

            <figure>

    </main>
</body>
</html>
